<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 码上启航</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- 导航栏 -->
    <nav class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="../index.html" class="text-xl font-bold text-blue-600">码上启航</a>
                    <div class="ml-2 text-sm text-gray-600">计算机技能培训顾问</div>
                </div>
                <div class="flex items-center space-x-4">
                    <a href="../index.html" class="text-gray-700 hover:text-blue-600">返回聊天</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 页面内容 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 页面标题 -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">我的订单</h1>
            <p class="text-xl text-gray-600">查看您的课程订单状态和进度</p>
        </div>

        <!-- 订单查询 -->
        <section id="order-query" class="mb-16">
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-gray-900 mb-4">查询订单状态</h2>
                <p class="text-gray-600">输入订单号或手机号查询订单详情</p>
            </div>
            
            <div class="max-w-2xl mx-auto">
                <div class="bg-white rounded-lg shadow-md p-8">
                    <div class="space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">查询方式</label>
                            <div class="flex space-x-4">
                                <label class="flex items-center">
                                    <input type="radio" name="queryType" value="orderNumber" checked class="mr-2">
                                    <span>订单号</span>
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="queryType" value="phoneNumber" class="mr-2">
                                    <span>手机号</span>
                                </label>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">查询内容</label>
                            <input type="text" id="queryInput" placeholder="请输入订单号或手机号" 
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        </div>
                        
                        <button onclick="queryOrders()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition-colors">
                            查询订单
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 订单列表 -->
        <section id="order-list" class="mb-16">
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-gray-900 mb-4">我的订单</h2>
                <p class="text-gray-600">查看所有订单记录</p>
            </div>
            
            <div id="orders-container" class="space-y-6">
                <!-- 订单将通过JavaScript动态加载 -->
                <div class="text-center py-8">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mx-auto"></div>
                    <p class="text-gray-600 mt-2">加载中...</p>
                </div>
            </div>
        </section>

        <!-- 订单统计 -->
        <section id="order-stats" class="mb-16">
            <div class="text-center mb-12">
                <h2 class="text-3xl font-bold text-gray-900 mb-4">学习统计</h2>
                <p class="text-gray-600">您的学习成果概览</p>
            </div>
            
            <div class="grid md:grid-cols-4 gap-8">
                <div class="bg-white rounded-lg shadow-md p-6 text-center">
                    <div class="w-16 h-16 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-book text-blue-600 text-2xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-blue-600">3</h3>
                    <p class="text-gray-600">总课程数</p>
                </div>
                
                <div class="bg-white rounded-lg shadow-md p-6 text-center">
                    <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-clock text-green-600 text-2xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-green-600">156</h3>
                    <p class="text-gray-600">学习时长(小时)</p>
                </div>
                
                <div class="bg-white rounded-lg shadow-md p-6 text-center">
                    <div class="w-16 h-16 bg-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-certificate text-purple-600 text-2xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-purple-600">1</h3>
                    <p class="text-gray-600">获得证书</p>
                </div>
                
                <div class="bg-white rounded-lg shadow-md p-6 text-center">
                    <div class="w-16 h-16 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <i class="fas fa-star text-orange-600 text-2xl"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-orange-600">4.8</h3>
                    <p class="text-gray-600">平均评分</p>
                </div>
            </div>
        </section>
    </div>

    <!-- 页脚 -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center">
                <p>&copy; 2024 码上启航. 保留所有权利.</p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script>
        let currentQueryType = 'orderNumber';

        // 切换查询类型
        function switchQueryType(type) {
            currentQueryType = type;
            const inputs = document.querySelectorAll('input[name="queryType"]');
            inputs.forEach(input => {
                input.checked = input.value === type;
            });
        }

        // 查询订单
        async function queryOrders() {
            const queryInput = document.getElementById('queryInput');
            const queryValue = queryInput.value.trim();
            
            if (!queryValue) {
                alert('请输入查询内容');
                return;
            }

            try {
                let url;
                if (currentQueryType === 'phoneNumber') {
                    url = `/api/order/phone?phone=${encodeURIComponent(queryValue)}`;
                } else {
                    url = `/api/order/query?orderNumber=${encodeURIComponent(queryValue)}`;
                }

                const response = await fetch(url);
                const data = await response.json();
                
                if (data.success) {
                    displayOrders(data.data);
                } else {
                    alert(data.message || '查询失败');
                }
            } catch (error) {
                console.error('查询订单失败:', error);
                alert('查询失败，请稍后重试');
            }
        }

        // 显示订单列表
        function displayOrders(orders) {
            const container = document.getElementById('orders-container');
            
            if (!orders || orders.length === 0) {
                container.innerHTML = '<div class="text-center py-8"><p class="text-gray-600">暂无订单记录</p></div>';
                return;
            }

            // 如果是单个订单，转换为数组
            const ordersArray = Array.isArray(orders) ? orders : [orders];
            
            container.innerHTML = ordersArray.map(order => {
                const statusMap = {
                    'pending': { text: '待付款', class: 'bg-yellow-100 text-yellow-800' },
                    'paid': { text: '已付款', class: 'bg-blue-100 text-blue-800' },
                    'completed': { text: '已完成', class: 'bg-green-100 text-green-800' },
                    'cancelled': { text: '已取消', class: 'bg-red-100 text-red-800' }
                };
                
                const status = statusMap[order.status] || { text: '未知状态', class: 'bg-gray-100 text-gray-800' };
                const createTime = new Date(order.createTime).toLocaleString('zh-CN');
                const paymentTime = order.paymentTime ? new Date(order.paymentTime).toLocaleString('zh-CN') : '未支付';
                
                return `
                    <div class="bg-white rounded-lg shadow-md p-6">
                        <div class="flex items-center justify-between mb-4">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                                    <i class="fas fa-code text-blue-600 text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-lg font-semibold">${order.courseName || '未知课程'}</h3>
                                    <p class="text-gray-600 text-sm">订单号：${order.orderNumber}</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold text-blue-600">¥${order.amount}</div>
                                <span class="inline-block ${status.class} px-3 py-1 rounded-full text-sm font-medium">
                                    ${status.text}
                                </span>
                            </div>
                        </div>
                        
                        <div class="grid md:grid-cols-3 gap-4 text-sm text-gray-600">
                            <div>
                                <span class="font-medium">创建时间：</span>
                                ${createTime}
                            </div>
                            <div>
                                <span class="font-medium">支付时间：</span>
                                ${paymentTime}
                            </div>
                            <div>
                                <span class="font-medium">支付方式：</span>
                                ${order.paymentMethod || '未支付'}
                            </div>
                        </div>
                        
                        <div class="mt-4 pt-4 border-t border-gray-200">
                            <div class="flex items-center justify-between">
                                <div class="flex space-x-2">
                                    <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 text-sm">
                                        查看详情
                                    </button>
                                    <button class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 text-sm">
                                        联系客服
                                    </button>
                                </div>
                                ${order.status === 'completed' ? 
                                    '<button class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm">评价课程</button>' :
                                    '<button class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700 text-sm">继续学习</button>'
                                }
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 页面加载完成后执行
        document.addEventListener('DOMContentLoaded', function() {
            // 默认显示加载状态
            const container = document.getElementById('orders-container');
            container.innerHTML = '<div class="text-center py-8"><p class="text-gray-600">请输入查询条件查看订单</p></div>';
        });
    </script>
</body>
</html>
