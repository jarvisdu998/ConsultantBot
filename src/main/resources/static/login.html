<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课程管理系统 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .login-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-card {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
    </style>
</head>
<body>
<div id="app" class="min-h-screen login-container flex items-center justify-center p-4">
    <div class="login-card w-full max-w-md rounded-2xl shadow-2xl p-8">
        <!-- Logo和标题 -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-graduation-cap text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-2">课程管理系统</h1>
            <p class="text-gray-600">请登录您的账户</p>
        </div>

        <!-- 登录表单 -->
        <form @submit.prevent="handleLogin" class="space-y-6">
            <!-- 用户类型选择 -->
            <div class="flex bg-gray-100 rounded-lg p-1">
                <button 
                    type="button"
                    @click="userType = 'student'"
                    :class="['flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all',
                        userType === 'student' 
                            ? 'bg-white text-blue-600 shadow-sm' 
                            : 'text-gray-600 hover:text-gray-800']"
                >
                    <i class="fas fa-user-graduate mr-2"></i>学员登录
                </button>
                <button 
                    type="button"
                    @click="userType = 'admin'"
                    :class="['flex-1 py-2 px-4 rounded-md text-sm font-medium transition-all',
                        userType === 'admin' 
                            ? 'bg-white text-blue-600 shadow-sm' 
                            : 'text-gray-600 hover:text-gray-800']"
                >
                    <i class="fas fa-user-shield mr-2"></i>管理员登录
                </button>
            </div>

            <!-- 用户名输入 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-user mr-2"></i>用户名
                </label>
                <input 
                    v-model="username"
                    type="text"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none input-focus transition-all"
                    :placeholder="userType === 'student' ? '请输入学员用户名' : '请输入管理员用户名'"
                >
            </div>

            <!-- 密码输入 -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">
                    <i class="fas fa-lock mr-2"></i>密码
                </label>
                <div class="relative">
                    <input 
                        v-model="password"
                        :type="showPassword ? 'text' : 'password'"
                        required
                        class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:outline-none input-focus transition-all"
                        placeholder="请输入密码"
                    >
                    <button 
                        type="button"
                        @click="showPassword = !showPassword"
                        class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                    >
                        <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
            </div>

            <!-- 登录按钮 -->
            <button 
                type="submit"
                :disabled="isLoading"
                class="w-full btn-primary text-white py-3 rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed"
            >
                <span v-if="isLoading" class="flex items-center justify-center">
                    <i class="fas fa-spinner fa-spin mr-2"></i>登录中...
                </span>
                <span v-else class="flex items-center justify-center">
                    <i class="fas fa-sign-in-alt mr-2"></i>登录
                </span>
            </button>
        </form>

        <!-- 错误提示 -->
        <div v-if="errorMessage" class="mt-4 p-3 bg-red-100 border border-red-300 rounded-lg">
            <div class="flex items-center">
                <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                <span class="text-red-700 text-sm">{{ errorMessage }}</span>
            </div>
        </div>

        <!-- 测试账号提示 -->
        <div class="mt-6 p-4 bg-blue-50 border border-blue-200 rounded-lg">
            <h3 class="text-sm font-medium text-blue-800 mb-2">测试账号：</h3>
            <div class="text-xs text-blue-700 space-y-1">
                <div><strong>学员账号：</strong>student1 / 123456</div>
                <div><strong>管理员账号：</strong>admin1 / 123456</div>
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const username = ref('');
            const password = ref('');
            const userType = ref('student');
            const showPassword = ref(false);
            const isLoading = ref(false);
            const errorMessage = ref('');

            const handleLogin = async () => {
                if (!username.value.trim() || !password.value.trim()) {
                    errorMessage.value = '请填写完整的登录信息';
                    return;
                }

                isLoading.value = true;
                errorMessage.value = '';

                try {
                    const loginUrl = userType.value === 'student' ? '/api/student/login' : '/api/admin/login';
                    
                    const response = await fetch(loginUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username.value.trim(),
                            password: password.value
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        // 登录成功，设置登录状态
                        try {
                            const statusResponse = await fetch('/api/setLoginStatus?status=true', {
                                method: 'POST'
                            });
                            if (statusResponse.ok) {
                                // 跳转到主页
                                window.location.href = '/index.html';
                            } else {
                                errorMessage.value = '登录状态设置失败';
                            }
                        } catch (error) {
                            console.error('设置登录状态失败:', error);
                            errorMessage.value = '登录状态设置失败';
                        }
                    } else {
                        errorMessage.value = result.message || '登录失败，请检查用户名和密码';
                    }
                } catch (error) {
                    console.error('登录请求失败:', error);
                    errorMessage.value = '网络错误，请稍后重试';
                } finally {
                    isLoading.value = false;
                }
            };

            return {
                username,
                password,
                userType,
                showPassword,
                isLoading,
                errorMessage,
                handleLogin
            };
        }
    }).mount('#app');
</script>
</body>
</html>
