<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@3.2.31/dist/vue.global.min.js"></script>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        .login-container {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
        }
        
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .input-focus:focus {
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            border-color: #3b82f6;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .user-type-btn {
            transition: all 0.2s ease;
        }

        .user-type-btn.active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .error-message {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body>
<div id="app" class="login-container flex items-center justify-center p-4">
    <div class="login-card w-full max-w-xs rounded-xl shadow-xl p-6 fade-in">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 mx-auto mb-3 bg-gradient-to-br from-blue-500 to-purple-600 rounded-full flex items-center justify-center">
                <i class="fas fa-graduation-cap text-white text-lg"></i>
            </div>
            <h1 class="text-xl font-bold text-gray-800">码上启航</h1>
        </div>

        <!-- 登录表单 -->
        <form @submit.prevent="handleLogin" class="space-y-4">
            <!-- 用户类型选择 -->
            <div class="flex bg-gray-100 rounded-lg p-1">
                <button 
                    type="button"
                    @click="userType = 'student'"
                    :class="['user-type-btn flex-1 py-2 px-3 rounded text-xs font-medium',
                        userType === 'student' ? 'active' : 'text-gray-600']"
                >
                    学员
                </button>
                <button 
                    type="button"
                    @click="userType = 'admin'"
                    :class="['user-type-btn flex-1 py-2 px-3 rounded text-xs font-medium',
                        userType === 'admin' ? 'active' : 'text-gray-600']"
                >
                    管理员
                </button>
            </div>

            <!-- 用户名输入 -->
            <input 
                v-model="username"
                type="text"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none input-focus text-sm"
                placeholder="用户名"
            >

            <!-- 密码输入 -->
            <div class="relative">
                <input 
                    v-model="password"
                    :type="showPassword ? 'text' : 'password'"
                    required
                    class="w-full px-3 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none input-focus text-sm"
                    placeholder="密码"
                >
                <button 
                    type="button"
                    @click="showPassword = !showPassword"
                    class="absolute right-2 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                >
                    <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'" class="text-xs"></i>
                </button>
            </div>

            <!-- 登录按钮 -->
            <button 
                type="submit"
                :disabled="isLoading"
                class="w-full btn-primary text-white py-2 rounded-lg font-medium disabled:opacity-50 disabled:cursor-not-allowed text-sm"
            >
                <span v-if="isLoading">
                    <i class="fas fa-spinner fa-spin mr-1"></i>登录中
                </span>
                <span v-else>登录</span>
            </button>
        </form>

        <!-- 错误提示 -->
        <div v-if="errorMessage" class="mt-3 p-2 bg-red-50 border border-red-200 rounded error-message">
            <span class="text-red-700 text-xs">{{ errorMessage }}</span>
        </div>

        <!-- 返回链接 -->
        <div class="mt-3 text-center">
            <a href="/index.html" class="text-blue-500 hover:text-blue-600 text-xs">
                返回首页
            </a>
        </div>
    </div>
</div>

<script>
    const { createApp, ref } = Vue;

    createApp({
        setup() {
            const username = ref('');
            const password = ref('');
            const userType = ref('student');
            const showPassword = ref(false);
            const isLoading = ref(false);
            const errorMessage = ref('');

            const handleLogin = async () => {
                if (!username.value.trim() || !password.value.trim()) {
                    errorMessage.value = '请填写完整信息';
                    return;
                }

                isLoading.value = true;
                errorMessage.value = '';

                try {
                    const loginUrl = userType.value === 'student' ? '/api/student/login' : '/api/admin/login';
                    
                    const response = await fetch(loginUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            username: username.value.trim(),
                            password: password.value
                        })
                    });

                    const result = await response.json();

                    if (result.success) {
                        try {
                            const statusResponse = await fetch('/api/setLoginStatus?status=true', {
                                method: 'POST'
                            });
                            if (statusResponse.ok) {
                                window.location.href = '/index.html?fromLogin=true';
                            } else {
                                errorMessage.value = '登录失败';
                            }
                        } catch (error) {
                            console.error('设置登录状态失败:', error);
                            errorMessage.value = '登录失败';
                        }
                    } else {
                        errorMessage.value = result.message || '登录失败';
                    }
                } catch (error) {
                    console.error('登录请求失败:', error);
                    errorMessage.value = '网络错误';
                } finally {
                    isLoading.value = false;
                }
            };

            return {
                username,
                password,
                userType,
                showPassword,
                isLoading,
                errorMessage,
                handleLogin
            };
        }
    }).mount('#app');
</script>
</body>
</html>
